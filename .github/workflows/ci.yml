name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: FHE-ML service (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - run: pip install -r code/requirements.txt
      - run: python -m pytest
        working-directory: code/fhe-ml-service

  node:
    name: Backend API (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/backend/package-lock.json
      - run: npm ci
        working-directory: code/backend
      - run: npm test
        working-directory: code/backend

  e2e:
    name: End-to-end (node-seal -> API -> TenSEAL -> node-seal)
    runs-on: ubuntu-latest
    needs: [python, node]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r code/requirements.txt
      - name: Train the Edinburgh model (public copy, downloaded at run time)
        working-directory: code
        run: |
          python pilots/baseline/train_baseline.py --dataset edinburgh
          python pilots/sigmoid/fit_sigmoid.py --dataset edinburgh
      - name: Cross-library round trip (PR2 pilot scripts)
        working-directory: code/pilots/node-seal-roundtrip
        run: |
          npm ci
          npm run demo
          python train_export.py --dataset edinburgh
          node encrypt_real.mjs && python server_real.py && node decrypt_real.mjs
      - name: API end-to-end
        run: |
          cd code/fhe-ml-service
          FHE_SERVICE_TOKEN=ci-token uvicorn app:app --host 127.0.0.1 --port 8001 &
          cd ../backend && npm ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8001/health && break; sleep 1; done
          E2E_FHE_URL=http://127.0.0.1:8001 E2E_DATASET=edinburgh FHE_SERVICE_TOKEN=ci-token node --test test/e2e.test.js
